  - "06 面试题库":
      - "算法岗 85 题": "06-面试题库/01-算法岗高频问答.md"
      - "应用岗 65 题": "06-面试题库/02-应用岗高频问答.md"
      - "系统设计 8 题": "06-面试题库/03-系统设计题.md"
      - "真实面经 192 问": "06-面试题库/04-真实面经高频题.md"
      - "项目深挖 151 问": "06-面试题库/05-项目深挖与追问.md"
      - "手撕代码 12 类": "06-面试题库/06-手撕代码题.md"
  - "07 速查":
      - "公式与数字速查": "07-速查/01-公式与数字速查.md"
      - "术语中英对照（200 条）": "07-速查/02-术语中英对照.md"
  - "08 进阶专题":
      - "对齐算法推导": "08-进阶专题/01-对齐算法推导与对比.md"
      - "分布式与显存计算": "08-进阶专题/02-分布式训练与显存计算.md"
      - "推理与容量规划": "08-进阶专题/03-推理系统与容量规划.md"
      - "上下文与 Agent 工程": "08-进阶专题/04-上下文工程与Agent工程.md"
      - "评测与实验设计": "08-进阶专题/05-评测与实验设计.md"

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Zephverve/llm-interview-notes
      name: GitHub 仓库
